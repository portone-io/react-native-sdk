strictDepBuilds: true

allowBuilds:
  '@evilmartians/lefthook': true
  unrs-resolver: true

minimumReleaseAge: 4320
minimumReleaseAgeStrict: true

trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 525960
trustPolicyExclude:
  # CI 게시가 신규 패키지(lefthook-android-arm64) E404로 중단되어 메인테이너가 수동 게시함.
  # 서명된 태그 커밋(eb4e504b)과 gitHead 일치, 번들 바이너리가 OIDC 게시 플랫폼 패키지와 동일.
  # https://github.com/evilmartians/lefthook/pull/1598
  - '@evilmartians/lefthook@2.2.2'

blockExoticSubdeps: true

engineStrict: true

auditConfig:
  ignoreGhsas:
    # glob: 13.0.7에 abort 처리 수정이 백포트됨. 권고의 영향 범위(<=14.0.1)가 아직 갱신되지 않은 오탐.
    - GHSA-3g3m-2fjr-6pw4
    # minimatch: 외부에서 넣은 glob 패턴이 있어야 성립. react-native-builder-bob은 고정 패턴만 사용.
    - GHSA-g3hv-75wg-m249

catalog:
  '@changesets/cli': ^3.0.3
  '@types/react': ~19.3.0
  react: 19.3.1
  react-native: 0.88.1
  typescript: ~6.0.3
